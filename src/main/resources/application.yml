spring:
  security:
    oauth2:
      client:
        registration:
          spotify:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SPOTIFY_CLIENT_ID}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SPOTIFY_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
        provider:
          spotify:
            user-name-attribute: id

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG

app:
  frontend-url: ${APP_FRONTEND_URL:http://127.0.0.1:5173}

server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        same-site: none
        secure: true